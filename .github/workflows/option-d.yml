name: Option D validation
on:
  push:
    branches: ['implementation/option-d']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: option-d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mkdir -p artifacts && (sw_vers; uname -m; go version; xcodebuild -version) > artifacts/platform.txt
      - run: ./scripts/prepare-sqlcipher.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
      - run: go test -race -tags production ./...
      - run: ./scripts/native-smoke.sh
      - run: ./scripts/package-macos.sh
      - run: ./scripts/check-artifact.sh build/Pass.app/Contents/MacOS/Pass
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary build/Pass.app/Contents/MacOS/Pass > artifacts/go-vulnerability-scan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pass-${{ matrix.os }}
          path: |
            build/Pass.app
            artifacts/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: ./scripts/prepare-sqlcipher.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium && npx vite build --mode e2e && npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-results
